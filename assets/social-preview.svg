<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#0e1430"/>
      <stop offset="100%" stop-color="#14103a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="1075" cy="120" rx="430" ry="300" fill="url(#glow1)"/>
  <ellipse cx="105" cy="560" rx="360" ry="250" fill="url(#glow2)"/>

  <!-- 品牌宝石（与站点 logo-mark 同形） -->
  <g transform="translate(92,168) scale(3.4)">
    <polygon points="40,0 74,12 74,52 40,64 6,52 6,12"
             fill="none" stroke="url(#mark)" stroke-width="2.2" opacity="0.30"/>
    <polygon points="40,4 68,18 40,60 12,18" fill="url(#mark)"/>
    <polygon points="40,14 56,24 40,48 24,24" fill="#fff" opacity="0.16"/>
    <circle cx="40" cy="24" r="4" fill="#fff" opacity="0.92"/>
    <circle cx="40" cy="24" r="8" fill="#fff" opacity="0.16"/>
  </g>

  <!-- 文字 -->
  <text x="392" y="272"
        font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif"
        font-size="76" font-weight="800" fill="url(#wordmark)" letter-spacing="-1">GewuMind Boot</text>

  <text x="392" y="342"
        font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif"
        font-size="40" font-weight="600" fill="#a5b4fc">AI 开发工具 · 开源内核</text>

  <text x="392" y="418"
        font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif"
        font-size="33" fill="#e2e8f0">装上 gewumind-skill，让 AI 把需求变成应用</text>

  <text x="392" y="470"
        font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif"
        font-size="24" fill="#94a3b8">需求 → 设计 → 生成 → 发布   ·   任意 AI Agent 可接入</text>

  <!-- 底部标签 -->
  <g font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif" font-size="21" fill="#cbd5e1">
    <rect x="392" y="520" width="188" height="44" rx="22" fill="none" stroke="#334155" stroke-width="1.4"/>
    <text x="486" y="549" text-anchor="middle">magic-api</text>

    <rect x="596" y="520" width="228" height="44" rx="22" fill="none" stroke="#334155" stroke-width="1.4"/>
    <text x="710" y="549" text-anchor="middle">Spring Boot 3</text>

    <rect x="840" y="520" width="168" height="44" rx="22" fill="none" stroke="#334155" stroke-width="1.4"/>
    <text x="924" y="549" text-anchor="middle">MCP</text>
  </g>

  <text x="1188" y="586" text-anchor="end"
        font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif"
        font-size="22" fill="#64748b">gewumind.github.io</text>
</svg>